# Moodflow 的 Cargo workspace（Hub、MFP、开发工具）。输入法核心是 moodflow_input/ 下另一个 workspace，
# 两者互不包含（docs/adr/0007）。
[workspace]
resolver = "2"
exclude = ["moodflow_input", "moodflow_linux", "moodflow_macos"]
members = [
    "crates/mfp",
    "moodflow_hub/core",
    "moodflow_hub/gateway",
    "moodflow_hub/src-tauri",
    "tools/mf-sim",
    "tools/mock-ai",
    "tools/typer",
    "tools/db-grep",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
