[package]
name = "moodflow-webdata"
version.workspace = true
edition.workspace = true

[dependencies]
# 依赖方向是本 crate → coordinator（反过来会把 moodflow-transfer/fontdb 拉回
# Android 闭包）；移动端形态（moodflow-mobile）不依赖本 crate。
moodflow-coordinator = { path = "../moodflow-coordinator", default-features = false }
moodflow-config = { path = "../moodflow-config" }
moodflow-engine = { path = "../moodflow-engine" }
moodflow-aux-code = { path = "../moodflow-aux-code" }
moodflow-store = { path = "../moodflow-store" }
# 短语分发导入的能力分级（`phrase.previewImportText`）读 cmdbar 的函数 registry。
moodflow-cmdbar = { path = "../moodflow-cmdbar" }
moodflow-reverse = { path = "../moodflow-reverse" }
moodflow-theme = { path = "../moodflow-theme" }
moodflow-candidate = { path = "../moodflow-candidate" }
moodflow-keys = { path = "../moodflow-keys" }
moodflow-chord = { path = "../moodflow-chord" }
moodflow-translate = { path = "../moodflow-translate" }
moodflow-transfer = { path = "../moodflow-transfer" }
# 插件管理页（plugins.*）：本地包检查与安装、清单与能力。
moodflow-market = { path = "../moodflow-market" }
moodflow-plugin-api = { path = "../moodflow-plugin-api" }
moodflow-plugin-registry = { path = "../moodflow-plugin-registry" }
anyhow = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
toml = { workspace = true }
tracing = { workspace = true }
chrono = "0.4"
fontdb = "0.22"

[dev-dependencies]
# 只供测试对照内置格式表条数（quick.list 不该漏条目）。
moodflow-quick-input = { path = "../moodflow-quick-input" }
moodflow-bridge = { path = "../moodflow-bridge" }
# 手工构造 .wpkg 用（export_package 写不出带说明的 package.toml）；
# 与 moodflow-transfer 同一版本，不引入新的外部依赖。
zip = "2"

[lints]
workspace = true
