[package]
name = "moodflow-phrase"
version.workspace = true
edition.workspace = true

[dependencies]
moodflow-cmdbar = { path = "../moodflow-cmdbar" }
# 中文数字读法（${YC}/${MC}/${DC}）：与快捷输入的日期候选共用一份实现
moodflow-quick-input = { path = "../moodflow-quick-input" }
# `${APP_DIR}` 等内部目录变量：与命令栏字符串同源，见 moodflow_config::dir_var
moodflow-config = { path = "../moodflow-config" }
tracing = { workspace = true }
chrono = "0.4"
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
