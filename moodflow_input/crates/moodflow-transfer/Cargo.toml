[package]
name = "moodflow-transfer"
version.workspace = true
edition.workspace = true

[dependencies]
moodflow-store = { path = "../moodflow-store" }
moodflow-dict = { path = "../moodflow-dict" }
moodflow-config = { path = "../moodflow-config" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# 主题包要在落盘前校验 theme.toml 本身合法（坏主题别等回滚才发现），并取 meta 作展示名。
# moodflow-theme 是纯解析 crate，不反向依赖本 crate。
moodflow-theme = { path = "../moodflow-theme" }
zip = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
