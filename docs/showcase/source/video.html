<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Moodflow 产品展示</title>
<style>
@font-face { font-family: 'Nunito'; src: url('assets/nunito.ttf'); font-weight: 200 1000; }
:root {
  --navy: #1D3557; --blue: #4F9DE8; --blue-soft: #E8F1FD; --sun: #F7B940;
  --ink: #2b2a28; --ink2: #6b665e; --ink3: #9a9389; --line: #e7e1d8;
  --cream: #fffdf8; --warm: #f29e38;
  --w-sunny: #f6c344; --w-wind: #9fd3c7; --w-cloudy: #a99bd8; --w-rain: #7fa7c9; --w-storm: #e8875b; --w-night: #9aa3b2;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4F7FB;
  font-family: 'Nunito', 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', 'Noto Color Emoji', sans-serif; color: var(--ink); }
#stage { position: absolute; inset: 0; overflow: hidden; }
.scene { position: absolute; inset: 0; }
.abs { position: absolute; }
.center { display: flex; align-items: center; justify-content: center; }

/* 全局叠层 */
#chapter { position: absolute; left: 48px; top: 36px; display: flex; align-items: center; gap: 14px;
  font-size: 22px; color: var(--navy); font-weight: 700; z-index: 50; }
#chapter img { height: 30px; }
#chapter .sep { width: 1px; height: 22px; background: #c9d3e0; }
#badge { position: absolute; right: 48px; top: 34px; z-index: 50; font-size: 20px; padding: 6px 16px; border-radius: 999px; font-weight: 700; }
.b-done { background: #E3F4EA; color: #237a4b; }
.b-preview { background: #FFF2D9; color: #a5650a; }
.b-plan { background: #EDE8FB; color: #5d47b0; }
#caption { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 50; text-align: center;
  background: rgba(255,255,255,0.92); border-radius: 22px; padding: 18px 40px 20px; box-shadow: 0 10px 40px rgba(29,53,87,0.12);
  width: max-content; max-width: 1560px; }
#caption .t { font-size: 40px; font-weight: 800; color: var(--navy); letter-spacing: 1px; }
#caption .s { font-size: 24px; color: #4d5b70; margin-top: 6px; }
#progress { position: absolute; left: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--navy), var(--blue)); z-index: 60; }
#fade { position: absolute; inset: 0; background: #F4F7FB; z-index: 40; pointer-events: none; }

/* 桌面 */
.desk { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 20% 15%, #dfe9f7, transparent),
  radial-gradient(900px 700px at 85% 80%, #f6e7d8, transparent), linear-gradient(135deg, #e9eef6, #f3ede6); }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(245,247,250,0.92);
  border-top: 1px solid #dde3ea; display: flex; align-items: center; justify-content: flex-end; padding: 0 22px; gap: 18px; font-size: 18px; color: #3b4656; }
.taskbar .ime { width: 34px; height: 34px; border-radius: 8px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.taskbar .wx { font-size: 22px; }
.win { position: absolute; background: #fff; border-radius: 14px; box-shadow: 0 24px 60px rgba(29,53,87,0.18); overflow: hidden; border: 1px solid #e3e8ef; }
.win .bar { height: 44px; background: #f6f8fb; border-bottom: 1px solid #e8edf3; display: flex; align-items: center; padding: 0 18px; font-size: 18px; color: #4a5568; gap: 10px; }
.win .bar .dots { margin-left: auto; color: #a0aab8; letter-spacing: 6px; }
.win .body { padding: 26px 32px; font-size: 30px; line-height: 1.7; color: #1f2733; }
.caret { display: inline-block; width: 3px; height: 1.05em; background: var(--navy); vertical-align: -0.15em; margin-left: 2px; }

/* 候选窗 */
.cand { position: absolute; background: #fff; border-radius: 12px; box-shadow: 0 12px 34px rgba(29,53,87,0.22); border: 1px solid #e2e8f0;
  padding: 10px 14px 12px; font-size: 26px; white-space: nowrap; z-index: 20; }
.cand .pre { color: var(--blue); font-size: 22px; padding: 0 6px 6px; border-bottom: 1px solid #edf1f6; margin-bottom: 6px; }
.cand .row { display: flex; gap: 6px; }
.cand .it { padding: 4px 12px; border-radius: 8px; color: #1f2733; }
.cand .it i { font-style: normal; color: #94a0b2; font-size: 20px; margin-right: 6px; }
.cand .it em { font-style: normal; color: #9aa6b6; font-size: 18px; margin-left: 6px; }
.cand .it.hi { background: var(--blue-soft); color: var(--navy); font-weight: 700; }
.cand .it.hi i { color: var(--blue); }
.cand.vert .row { flex-direction: column; gap: 2px; }

.key { display: inline-flex; align-items: center; justify-content: center; min-width: 54px; height: 54px; padding: 0 16px; border-radius: 12px;
  background: #fff; border: 1px solid #d5dce6; box-shadow: 0 3px 0 #c9d1dc; font-size: 22px; color: var(--navy); font-weight: 700; }
.key.on { background: var(--navy); color: #fff; box-shadow: 0 1px 0 #0f2238; transform: translateY(2px); }
.keys { position: absolute; display: flex; gap: 10px; align-items: center; font-size: 22px; color: #4d5b70; z-index: 30; }

.card { position: absolute; background: #fff; border-radius: 18px; box-shadow: 0 16px 44px rgba(29,53,87,0.14); border: 1px solid #e6ebf2; }
.toast { position: absolute; background: #fff; border-radius: 16px; box-shadow: 0 16px 44px rgba(29,53,87,0.18); border: 1px solid #e6ebf2; padding: 18px 22px; font-size: 22px; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 18px; }
.btn { display: inline-block; padding: 8px 18px; border-radius: 10px; font-size: 20px; background: var(--blue-soft); color: var(--navy); font-weight: 700; }
.btn.pri { background: var(--navy); color: #fff; }
.muted { color: var(--ink3); }

/* 晴晴 */
.pet { position: absolute; width: 192px; height: 208px; transform-origin: 50% 100%; }
.pet .l { position: absolute; inset: 0; background-repeat: no-repeat; }
.pet .body { -webkit-mask-image: url(assets/body.png); -webkit-mask-repeat: no-repeat; -webkit-mask-size: 1536px 1872px; }
.pet .lines { background-image: url(assets/lines.png); background-size: 1536px 1872px; }
.bubble { position: absolute; background: #fff; border-radius: 18px; padding: 14px 20px; font-size: 24px; color: #3b3a37; box-shadow: 0 10px 30px rgba(0,0,0,0.12); white-space: nowrap; }

/* Hub 暖色界面 */
.hub { background: var(--cream); color: var(--ink); }
.hub .bar { background: #fbf6ee; border-color: #efe6d8; color: #6b665e; }

/* 手机 */
.phone { position: absolute; width: 470px; height: 960px; border-radius: 56px; background: #111; padding: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
.phone .scr { position: absolute; inset: 14px; border-radius: 44px; overflow: hidden; background: #f3f5f8; }
.kb { position: absolute; left: 0; right: 0; bottom: 0; }
.kb .ck { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-size: 22px; }

/* 情绪部分：产品界面（暖色卡片） */
.mfw { position: absolute; width: 420px; height: 210px; background: #fffdf8; border: 1px solid #efe6d8; border-radius: 22px; box-shadow: 0 18px 50px rgba(60,40,10,.16); z-index: 20; overflow: hidden; }
.mfw .wt { position: absolute; left: 140px; top: 20px; font-size: 20px; color: #6b665e; display: flex; align-items: center; gap: 8px; }
.mfw .dot { width: 12px; height: 12px; border-radius: 50%; }
.mfw .wm { position: absolute; left: 140px; right: 20px; top: 54px; font-size: 24px; font-weight: 800; line-height: 1.45; color: #2b2a28; }
.mfw .wf { position: absolute; left: 20px; right: 20px; bottom: 14px; border-top: 2px dashed #eee5d6; padding-top: 9px; display: flex; justify-content: space-between; font-size: 18px; color: #6b665e; }
.aitag { display: inline-block; font-size: 16px; font-weight: 500; color: #8a7a55; background: #f4eee0; border: 1px solid #e9dfc8; border-radius: 999px; padding: 0 10px; margin-left: 6px; vertical-align: 3px; }
.mc { position: absolute; background: #fffdf8; border: 1px solid #efe6d8; border-radius: 20px; box-shadow: 0 18px 50px rgba(60,40,10,.12); }
.ob { display: inline-block; background: #f29e38; color: #fff; font-weight: 800; border-radius: 12px; padding: 8px 20px; font-size: 21px; transition: none; }
.gb { display: inline-block; background: #fff; border: 1.5px solid #e4dccd; color: #3b3a37; border-radius: 12px; padding: 7px 18px; font-size: 21px; }
.lb { display: inline-block; color: #8b857b; padding: 8px 10px; font-size: 21px; }
.pressed { transform: scale(.93); filter: brightness(.9); }
.dw { position: absolute; background: #f7f8fa; border: 1px solid #e3e8ef; border-radius: 16px; box-shadow: 0 24px 60px rgba(29,53,87,.16); overflow: hidden; }
.dw .dbar { height: 56px; background: #fffdf8; border-bottom: 1px solid #ece6db; display: flex; align-items: center; gap: 10px; padding: 0 22px; font-size: 21px; }
.dw .dbar span { color: #8b857b; font-size: 19px; }
.dw .dbar i { margin-left: auto; font-style: normal; color: #8b857b; }
.dw .dbody { position: relative; height: calc(100% - 56px); }
.msgs { position: absolute; left: 0; right: 0; top: 0; bottom: 190px; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; justify-content: flex-end; overflow: hidden; }
.mrow { display: flex; gap: 14px; align-items: flex-start; }
.mrow.me { justify-content: flex-end; }
.mrow .av { width: 52px; height: 52px; border-radius: 10px; color: #fff; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; }
.mrow .nm { font-size: 17px; color: #8b857b; margin-bottom: 4px; }
.mrow .bub { background: #fff; border-radius: 12px; padding: 12px 18px; font-size: 24px; max-width: 640px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.mrow .bub.me { background: #d9ebff; }
.cinput { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; background: #fff; border-top: 1px solid #e8edf3; padding: 14px 24px; }
.cinput .icons { font-size: 22px; letter-spacing: 8px; }
.cin { position: relative; margin-top: 14px; font-size: 26px; color: #1f2733; white-space: nowrap; }
.cin u { text-decoration: underline dotted #4F9DE8; color: #4F9DE8; }
.tg { display: inline-block; width: 64px; height: 36px; border-radius: 18px; background: #d9d3c8; position: relative; }
.tg::after { content: ""; position: absolute; left: 4px; top: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; }
.tg.on { background: #f29e38; }
.tg.on::after { left: 32px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>
<div id="chapter"><img src="assets/mark.png"><div class="sep"></div><span id="chapterName"></span></div>
<div id="badge"></div>
<div id="caption"><div class="t"></div><div class="s"></div></div>
<div id="progress"></div>
<script>
// ───────── 工具 ─────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const E = (t, a, b) => eo(P(t, a, b));
const lerp = (a, b, k) => a + (b - a) * k;
window.SFX = new Map(); let CUR_START = 0;
const sfx = (type, at, key) => { if (at >= CUR_START - 0.5) window.SFX.set(type + '|' + (key || at.toFixed(3)), { type, t: +at.toFixed(3) }); };
const typedQ = (s, t, a, cps = 9) => [...s].slice(0, Math.max(0, Math.floor((t - a) * cps))).join('');
const typed = (s, t, a, cps = 9) => {
  const out = typedQ(s, t, a, cps);
  for (let i = 0; i < [...out].length; i++) sfx('key', CUR_START + a + i / cps);
  return out;
};
const $ = (root, k) => root.querySelector(`[data-k="${k}"]`);
const show = (el, o, dy = 0, sc = 1) => { el.style.opacity = o; el.style.transform = `translateY(${dy}px) scale(${sc})`; };
const pop = (el, t, a, d = 0.45) => { if (t >= a) sfx('pop', CUR_START + a); const k = P(t, a, a + d); show(el, clamp(k * 1.6), (1 - eo(k)) * 24, lerp(0.92, 1, back(k))); };
const W = { sunny: '#f6c344', wind: '#9fd3c7', cloudy: '#a99bd8', rain: '#7fa7c9', storm: '#e8875b', night: '#9aa3b2' };
const ROWS = { idle: [0, 6, 1.1], right: [1, 8, 1.06], left: [2, 8, 1.06], wave: [3, 4, 0.7], jump: [4, 5, 0.84], sad: [5, 8, 1.22], sleep: [6, 6, 1.01], run: [7, 6, 0.82], review: [8, 6, 1.03] };
function petHTML(k, scale = 1, extra = '') {
  return `<div class="pet" data-k="${k}" style="transform:scale(${scale});${extra}"><div class="l body"></div><div class="l lines"></div></div>`;
}
const WN = Object.fromEntries(Object.entries(W).map(([k, v]) => [v, k]));
function petAt(el, state, t, color) {
  const [row, frames, dur] = ROWS[state];
  const f = Math.floor(((t % dur) / dur) * frames) % frames;
  const b = el.children[0], l = el.children[1];
  b.style.display = 'none';
  l.style.backgroundImage = `url(assets/pet-${WN[color || W.sunny] || 'sunny'}.png)`;
  l.style.backgroundPosition = `${-f * 192}px ${-row * 208}px`;
}
function cand(list, hi = 0, pre = '', extra = '') {
  return `<div class="cand ${extra}">${pre ? `<div class="pre">${pre}</div>` : ''}<div class="row">${list.map((c, i) =>
    `<div class="it ${i === hi ? 'hi' : ''}"><i>${i + 1}</i>${c}</div>`).join('')}</div></div>`;
}
const desk = (extra = '') => `<div class="desk"></div><div class="taskbar">${extra}<span class="wx">☀️</span><span class="ime">中</span><span>10:24</span></div>`;

// ───────── 场景 ─────────
const S = [];
const scene = o => S.push(o);

// 0 片头
scene({ id: 'intro', dur: 7.5, chapter: '', badge: '', caption: ['', ''], build: () => `
  <div class="abs" style="inset:0;background:radial-gradient(900px 600px at 50% 40%, #ffffff, #EEF3FA)"></div>
  <div class="abs center" style="left:0;right:0;top:300px;flex-direction:column">
    <div data-k="logo" style="position:relative;width:1100px;height:${Math.round(1100 * 271 / 1581)}px">
      <img data-k="mk" src="assets/logo-horizontal.png" style="position:absolute;inset:0;width:100%">
      <img data-k="word" src="assets/logo-horizontal.png" style="position:absolute;inset:0;width:100%;clip-path:inset(0 0 0 38%)">
    </div>
    <div data-k="tag" style="font-size:54px;font-weight:800;color:#1D3557;margin-top:40px;letter-spacing:6px">懂你心情的 AI 输入陪伴</div>
    <div data-k="sub" style="font-size:28px;color:#4d5b70;margin-top:20px;letter-spacing:2px">Windows 输入法 · 陪伴伙伴「晴晴」</div>
  </div>
  `,
  init: () => {},
  draw: (r, t) => {
    const k1 = eio(P(t, 0.3, 2.0));
    $(r, 'mk').style.clipPath = `inset(0 ${100 - 36 * k1}% 0 0)`;
    const w = $(r, 'word'); w.style.opacity = E(t, 1.9, 2.7); w.style.transform = `translateX(${(1 - E(t, 1.9, 2.7)) * 40}px)`;
    show($(r, 'tag'), E(t, 2.6, 3.4), (1 - E(t, 2.6, 3.4)) * 20);
    show($(r, 'sub'), E(t, 3.2, 4.0), (1 - E(t, 3.2, 4.0)) * 20);
  } });

// 1 一览
scene({ dur: 9, chapter: '一览', badge: '', caption: ['一个输入法，加一位懂你的伙伴', '正常打字就好：它照顾你的状态，帮你记日程、把话说得更好听'], build: () => `
  <div class="abs" style="inset:0;background:linear-gradient(180deg,#F4F7FB,#EAF0F8)"></div>
  ${[['🌤️', '懂你的心情', '从打字节奏看出心情天气<br>暖心话 · 对话 · 情绪日记 · 看板'], ['⌨️', '好用的输入法', '五笔 · 全拼 · 双拼 · 混输<br>候选矩阵 · Buffer · 剪贴板 · 并击'], ['🧰', '效率工具', '截图 · 取字 · 资料库<br>密码库 · 工作区 · 同步'], ['🧩', '插件', '沙箱运行 · 默认无权限<br>插件商店 · 签名校验']].map((c, i) => `
  <div class="card" data-k="c${i}" style="left:${150 + i * 415}px;top:250px;width:370px;height:430px;padding:40px 34px">
    <div style="font-size:72px">${c[0]}</div>
    <div style="font-size:38px;font-weight:800;color:#1D3557;margin-top:18px">${c[1]}</div>
    <div style="font-size:24px;color:#5a6678;margin-top:16px;line-height:1.7">${c[2]}</div>
  </div>`).join('')}
  ${petHTML('pet', 0.9)}`,
  draw: (r, t) => {
    for (let i = 0; i < 4; i++) pop($(r, 'c' + i), t, 0.4 + i * 0.35, 0.6);
    const pet = $(r, 'pet'); pet.style.left = '864px'; pet.style.top = '660px'; petAt(pet, t > 2.2 ? 'wave' : 'idle', t);
    pet.style.opacity = E(t, 1.8, 2.3);
  } });

// 2 打字
scene({ dur: 10, chapter: '输入法', badge: 'done', caption: ['打字顺手，是一切的前提', '五笔 86 · 全拼 · 双拼 · 五笔拼音混输；整句输入、模糊音、用户词学习'], build: () => `
  ${desk()}
  <div class="win" style="left:260px;top:130px;width:1400px;height:640px"><div class="bar">📝 周报.txt — 记事本<span class="dots">— ▢ ✕</span></div>
    <div class="body"><span data-k="txt"></span><span class="caret"></span></div></div>
  <div data-k="cw" class="abs"></div>`,
  draw: (r, t) => {
    const seq = [
      { a: 0.5, py: 'jintian', list: ['今天', '金田', '今天的', '津田', '进天'], out: '今天', sel: 1.7 },
      { a: 2.2, py: 'tianqihenhao', list: ['天气很好', '天气', '填起', '天骑'], out: '天气很好，', sel: 4.0 },
      { a: 4.5, py: 'womenquchuqiuyou', list: ['我们去出秋游', '我们去', '我们', '握们'], out: '我们去出去秋游吧。', sel: 6.9, alt: ['我们去出去秋游吧', '我们去', '我们'] },
    ];
    let text = '', cw = '', x = 330;
    for (const s of seq) {
      if (t >= s.sel) { text += s.out; continue; }
      if (t >= s.a) {
        const py = typed(s.py, t, s.a, 11);
        const list = s.alt && py.length === s.py.length ? s.alt : s.list;
        cw = cand(list, 0, py.replace(/(.)/g, '$1'));
      }
      break;
    }
    if (t > 7.4) text = '今天天气很好，我们去出去秋游吧。';
    $(r, 'txt').textContent = text;
    const w = $(r, 'cw'); w.innerHTML = cw; w.style.left = (330 + text.length * 30) + 'px'; w.style.top = '252px';
  } });

// 3 混输
scene({ dur: 8, chapter: '输入法', badge: 'done', caption: ['五笔和拼音，不用切换', '混输：五笔码、拼音都能打出「你好」；拼音候选旁边提示五笔编码，顺手就学会了'], build: () => `
  ${desk()}
  <div class="win" style="left:260px;top:130px;width:1400px;height:640px"><div class="bar">💬 和小林的聊天<span class="dots">— ▢ ✕</span></div>
    <div class="body" style="font-size:28px"><div class="muted" style="font-size:22px">五笔：wqvb ｜ 拼音：nihao</div><div style="margin-top:18px"><span data-k="txt"></span><span class="caret"></span></div></div></div>
  <div data-k="cw" class="abs" style="left:330px;top:310px"></div>
  <div class="keys" data-k="hint" style="left:1180px;top:200px"></div>`,
  draw: (r, t) => {
    let text = '', cw = '';
    if (t < 2.3) { const py = typed('wqvb', t, 0.6, 5); if (py) cw = cand(['你好', '你们', '亻'], 0, py); }
    if (t >= 2.3) text = '你好';
    if (t >= 2.8 && t < 5.6) { const py = typed('nihao', t, 2.8, 5); if (py) cw = cand(['你好<em>wqvb</em>', '拟好<em>rnvb</em>', '你<em>wq</em>', '妮<em>vnx</em>'], 0, py); }
    if (t >= 5.6) text = '你好你好';
    if (t >= 6.0) text = '你好你好，在吗？';
    $(r, 'txt').textContent = text; $(r, 'cw').innerHTML = cw;
    $(r, 'cw').style.left = (330 + text.length * 28) + 'px';
    $(r, 'hint').innerHTML = t < 2.6 ? '<span class="pill b-done">五笔满码唯一，自动上屏</span>' : t < 5.8 ? '<span class="pill" style="background:#E8F1FD;color:#1D3557">拼音候选后面是五笔编码</span>' : '';
  } });

// 4 快捷输入与简繁
