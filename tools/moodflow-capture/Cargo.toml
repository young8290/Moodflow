[package]
name = "moodflow-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
moodflow-capsule = { path = "../../crates/moodflow-capsule" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rqrr = { version = "0.10", default-features = false }
gif = "0.14"

[build-dependencies]
tauri-winres = "0.3"

[dev-dependencies]
tempfile = "3"
qrcodegen = "1.8"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_HiDpi"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
