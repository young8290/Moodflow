# Windows applications use Rust's complete static CRT linkage. Keep this at the
# workspace root so direct Cargo/Tauri builds have the same policy as dev.ps1.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
